<script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
<script>
    // Connexion au serveur PeerJS public gratuit
    const peer = new Peer(); 
    
    peer.on('open', (id) => {
        console.log('Mon ID est : ' + id);
        alert('Partage cet ID : ' + id); // Ou affiche-le à l'écran
    });

    // Quand quelqu'un (le surveillant) appelle
    peer.on('call', (call) => {
        navigator.mediaDevices.getUserMedia({ video: true, audio: false })
            .then((stream) => {
                call.answer(stream); // Répondre avec le flux vidéo
                const video = document.getElementById('remoteVideo');
                video.srcObject = stream;
                video.play();
            });
    });
</script>
